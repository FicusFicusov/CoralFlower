# SPDX-License-Identifier: GPL-3.0-only
# A fresh clone builds: on every push and pull request, without the JieLi toolchain. Nothing generated is in git:
# tools/build.py --gen-only writes build/gen (fonts, icons, keycaps, palettes, tables, samples), then the single unit
# firmware/src/coralflower.c compiles for an ARM target (every include there), the headless emulator builds from it
# and plays a short script, the host tests run, and the tree git tracks is left as it was. What anyone building from
# source needs first, and the firmware hub's converter (thefirmwarehub.com/convert) with them.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # as release.yml: the generated headers (fonts with Raqm) depend on these versions
  PYTHON_VERSION: "3.11"
  PILLOW_VERSION: "11.1.0"
  FONTTOOLS_VERSION: "4.66.1"

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python packages (Pillow with Raqm, fontTools)
        run: |
          set -euo pipefail
          # Pillow wheels bundle Raqm; do not require an Ubuntu mirror when its
          # runtime dependencies are already on the runner. Still verify Raqm.
          python3 -m pip install --disable-pip-version-check --only-binary=Pillow "Pillow==$PILLOW_VERSION" "fonttools==$FONTTOOLS_VERSION"
          required_packages=()
          python3 -c 'from PIL import features; import sys; sys.exit(0 if features.check("raqm") else 1)' || required_packages+=(libfribidi0)
          if (( ${#required_packages[@]} )); then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "${required_packages[@]}"
          fi
          python3 -c 'from PIL import features; import sys; ok = features.check("raqm"); print("raqm", features.version("raqm")); sys.exit(0 if ok else "Pillow has no Raqm layout")'

      - name: Generated headers (tools/build.py --gen-only)
        run: python3 tools/build.py --gen-only

      - name: The unit compiles (an ARM target, every include present)
        run: |
          for diagnostic in 0 1; do
            clang -target armv7m-none-eabi -Os -fno-builtin -w -Ifirmware/hal -Ifirmware/src -Ibuild/gen \
                  -DCF_EVENT_DIAG="$diagnostic" -fsyntax-only firmware/src/coralflower.c
          done

      - name: The headless emulator builds and plays
        run: |
          set -euo pipefail
          printf 'wait 1500\nkey 7 down\nwait 400\nkey 7 up\nwait 300\nbtn SEQ\nwait 300\nbtn SEQ\nwait 300\ndump\n' \
              > build/smoke.txt
          sh tools/emu/cf_headless.sh build/smoke.txt build/smoke | tail -20

      - name: Host tests
        run: |
          set -euo pipefail
          mkdir -p build/host
          python3 -m pip install --disable-pip-version-check numpy==1.26.4
          python3 tests/cf_headless_clock_wav_test.py
          cc -std=c11 -O1 -g -w -fsanitize=address,undefined tests/cf_event_deadline_test.c -o build/host/cf_event_deadline_test
          build/host/cf_event_deadline_test
          python3 tests/cf_diag_build_test.py
          for diagnostic in 0 1; do
            cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG="$diagnostic" \
               -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_ui_diag_test.c \
               -o "build/host/cf_ui_diag_$diagnostic" -lm
            "build/host/cf_ui_diag_$diagnostic" build/host/ui-diag.bin
          done
          python3 tests/cf_ui_diag_test.py build/host/ui-diag.bin
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined tests/cf_render_timing_test.c -o build/host/cf_render_timing_test
          build/host/cf_render_timing_test
          for diagnostic in 0 1; do
            cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG="$diagnostic" \
               -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_render_diag_test.c \
               -o "build/host/cf_render_diag_$diagnostic" -lm
            "build/host/cf_render_diag_$diagnostic" build/host/render-diag.bin
          done
          python3 tests/cf_render_diag_test.py build/host/render-diag.bin
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG=1 \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_shed_policy_test.c -o build/host/cf_shed_policy_test -lm
          build/host/cf_shed_policy_test
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG=1 \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_drum_level_test.c -o build/host/cf_drum_level_test -lm
          for kit in 0 1 2 3 4 5 6; do
            build/host/cf_drum_level_test "$kit"
          done
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG=1 \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_event_trace_test.c -o build/host/cf_event_trace_test -lm
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG=0 \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_event_trace_test.c -o build/host/cf_event_trace_off -lm
          for preset in 0 25 30; do
            build/host/cf_event_trace_test "$preset" "build/host/diag-$preset.wav" "build/host/diag-$preset.pages"
            build/host/cf_event_trace_off "$preset" "build/host/diag-off-$preset.wav" "build/host/unused.pages"
            cmp "build/host/diag-$preset.wav" "build/host/diag-off-$preset.wav"
            python3 tests/cf_event_trace_test.py "build/host/diag-$preset.pages" "build/host/diag-$preset.wav"
          done
          cc -std=c99 -Wall -Wextra -Werror -Ifirmware/hal -o build/host/fm1_flash_id_test tests/fm1_flash_id_test.c
          build/host/fm1_flash_id_test
          cc -std=c11 -O1 -g -w -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/cf_flash_test.c -o build/host/cf_flash_test
          build/host/cf_flash_test
          cc -std=c11 -O1 -g -w -fsanitize=address,undefined -DST_ASYNC=1 \
             tests/cf_flash_test.c -o build/host/cf_flash_async_test
          build/host/cf_flash_async_test
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB -DCF_EVENT_DIAG=1 \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_settings_async_test.c \
             -o build/host/cf_settings_async_test -lm
          for chip in 0 1 restart restart-rom; do build/host/cf_settings_async_test "$chip"; done
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -fno-omit-frame-pointer -DEMU_WEB \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src tests/cf_flash_audio_test.c \
             -o build/host/cf_flash_audio_test -lm
          for preset in 0 25 30; do
            for rate in 44100 48000; do
              for chip in 0 1; do
                build/host/cf_flash_audio_test "$preset" "$rate" "$chip" "build/host/flash-$preset-$rate-$chip.wav" 4
              done
            done
          done
          # (the emulator's <os/lock.h> is macOS's; tools/emu/web/compat has the single-threaded one, as the headless build)
          cc -std=gnu11 -O1 -w -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src -Itests -o build/host/cf_backup_test \
             tests/cf_backup_test.c -lm
          build/host/cf_backup_test
          cc -std=gnu11 -O1 -w -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src -DEMU_WEB \
             -o build/host/cf_ui_gestures_test tests/cf_ui_gestures_test.c
          for scenario in copy-other copy-same copy-empty copy-cancel-play copy-cancel-rec sel-bars sel-position sel-drum; do
            build/host/cf_ui_gestures_test "$scenario"
          done
          cc -std=c99 -O2 -Wall -Wextra -Wno-unused-function -Wno-int-to-pointer-cast \
             -o build/host/midi_spp_test tests/midi_spp_test.c
          build/host/midi_spp_test
          cc -std=c11 -O1 -g -w -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/cf_usb_audio_protocol_test.c -o build/host/cf_usb_audio_protocol_test
          build/host/cf_usb_audio_protocol_test
          cc -std=c11 -O1 -g -w -fsanitize=address,undefined -fno-omit-frame-pointer \
             tests/cf_usb_disconnect_test.c -o build/host/cf_usb_disconnect_test
          build/host/cf_usb_disconnect_test
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src \
             tests/cf_usb_audio_mix_test.c -o build/host/cf_usb_audio_mix_test -lm
          for rate in 44100 48000; do
            for preset in 0 25 30; do
              build/host/cf_usb_audio_mix_test "$preset" "$rate" "build/host/usb-$preset-$rate.wav"
            done
          done
          build/host/cf_usb_audio_mix_test 30 48000 build/host/usb-allfx.wav allfx
          cc -std=gnu11 -O2 -w -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src -DEMU_WEB \
             -o build/host/cf_clock_test tests/cf_clock_test.c
          for scenario in transport acquisition locate rhythm recovery arp out count-in switch transfer restart; do
            build/host/cf_clock_test "$scenario"
          done
          for bpm in 90 120 137 300; do
            build/host/cf_clock_test timing "$bpm" 0
          done
          build/host/cf_clock_test timing 120 1
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src \
             tests/cf_clock_local_test.c -o build/host/cf_clock_local_test -lm
          build/host/cf_clock_local_test seed build/host/clock-in.flash
          for preset in 0 25 30; do
            build/host/cf_clock_local_test run build/host/clock-in.flash "$preset" "build/host/clock-local-$preset.wav"
          done
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src \
             tests/cf_arp_pause_test.c -o build/host/cf_arp_pause_test -lm
          for preset in 0 25 30; do
            build/host/cf_arp_pause_test "$preset" "build/host/arp-pause-$preset.wav"
          done
          cc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -DEMU_WEB \
             -Itools/emu/web/compat -Ibuild/gen -Ifirmware/src \
             tests/cf_arp_disconnect_test.c -o build/host/cf_arp_disconnect_test -lm
          for preset in 0 25 30; do
            for target in pattern rhythm; do
              build/host/cf_arp_disconnect_test "$preset" "$target" "build/host/arp-disconnect-$preset-$target.wav"
            done
          done
          cc -std=c99 -Wall -Wextra -Ifirmware/src -o build/cf_chord_test tests/cf_chord_test.c firmware/src/cf_chord.c \
             firmware/src/cf_theory.c
          build/cf_chord_test
          cc -std=gnu11 -O2 -Wall -Wno-unused-function -Ifirmware/src -o build/host/st_log_test tests/st_log_test.c
          build/host/st_log_test

      - name: The tracked tree is as it was
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain --untracked-files=no)"
